<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <!-- Kipchak organisation banner. Paper ground so it reads the same in GitHub's light and dark themes. -->
  <defs>
    <pattern id="lattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#137a72"/>
      <rect x="8" y="8" width="16" height="16" transform="rotate(45 16 16)" fill="#7d2230"/>
      <rect x="12" y="12" width="8" height="8" fill="#fafaf6"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#fafaf6"/>
    <rect y="296" width="1280" height="24" fill="url(#lattice)"/>
    <rect width="1280" height="4" fill="#137a72"/>
  </g>
  <g transform="translate(100 86) scale(4.2)">
    <rect x="9" y="9" width="18" height="18" transform="rotate(45 18 18)" fill="#7d2230"/>
    <rect x="9" y="9" width="18" height="18" fill="#137a72"/>
    <rect x="13.5" y="13.5" width="9" height="9" transform="rotate(45 18 18)" fill="#fafaf6"/>
  </g>
  <text x="300" y="104" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#0c5c56">AN API DEVELOPMENT KIT FOR PHP</text>
  <text x="296" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="500" fill="#1c211f">Kipchak</text>
  <text x="300" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#137a72">Everything for the road. Nothing you don’t need.</text>
  <text x="300" y="260" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#5b625f">Slim 4 · FrankenPHP worker mode · PHP 8.4 and 8.5</text>
</svg>
